<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="samemyWeatherApp.css">
</head>
<body>
    <div id="main-div">

        <h1>The Cloud</h1>

        <div id="search-div">

            <input type="text" id="city-input" placeholder="Enter a city name"> 

            <button id="search-btn">search</button>

        </div>
        <div id="result-div">
            <h2 id="city"></h2>
            <p id="country-code"></p>
            <p id="temperature"></p>
            <p id="weather-description"></p>
            <p id="humidity"></p>
            <p id="wind-speed"></p>
            <p id="error-message"></p>
            <img src="" alt="weather-icon" id="weather-icon">

        </div>
    </div>
    
    <script src="samemyWeatherApp.js"></script>
</body>
</html>

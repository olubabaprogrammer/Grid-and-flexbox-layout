<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="exercise.css">
</head>
<body class="dark-mode">

    <h1 id="title">Hello World</h1>
    <button id="btn">Click Me</button>
<hr>

<h2 id="product-name">Old Product</h2>
<p id="product-price">$0</p>
<img id="product-img" src="" alt="product" width="300">
<button id="sold-out-btn">Buy Now</button>
<hr>

<div id="blog-post">
    <h3 id="post-title">Post Title</h3>
    <p id="post-body">post content goes here</p>
    <span><p id="post-date"></p></span>
    <button id="read-more">Read more</button>
</div>
<hr>

<input type="text" id="task-input" placeholder="Enter a task">
<button id="add-btn">Add Task</button>
<ul id="task-list"></ul>
<hr>

<textarea name="theTextArea" id="tweet-box" placeholder="What's happening?"></textarea>
<p id="char-count">280 characters remaining</p>
<button id="post-btn">post</button>
<hr>

<div class="gallery">
<div id="gallery">
    <img id="main-img" src="" alt="main image">
    <p id="img-caption">Select a photo</p>
</div>
<div id="thumbnails"></div>
</div>
<hr>

<input type="password" id="password" placeholder="Enter Password">
<p id="strength-text"></p>
<div id="strength-bar"></div>
<hr>

<button id="theme-btn">Toggle Dark Mode</button>
<h1 id="page-title">my website</h1>
<p id="page-text">Welcome to my page!</p>
<hr>

<textarea placeholder="write a note...." id="note-input"></textarea>
<button id="save-btn">Save Note</button>
<p id="saved-note"></p>
<hr>

<input type="text" id="username" placeholder="UserName">
<input type="checkbox" id="remember-me"> Remember me
<button id="login-btn">Login</button>
<hr>

<button id="productBtn" data-product="Laptop">View Laptop</button>
<button id="productBtn" data-product="Headphones">View Headphones</button>

<h3>Recently Viewed:</h3>
<ul id="recently-viewed"></ul>
<hr>

<nav>
    <span>My Store</span>
    <span>Cart: <span id="cart-count">0</span></span>
</nav>

<div>
    <p>Laptop - #250,000</p>
    <button class="add-to-cart">Add to Cart</button>
</div>

<div>
    <p>Headphones - #15,000</p>
    <button class="add-to-cart">Add to Cart</button>
</div>
<div>
    <p>phone - #120,000</p>
    <button class="add-to-cart">Add to Cart</button>
</div>

    <script src="exercises.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="new.css">
</head>
<body>   
   <div class="buttons">

    <h3>Rock Paper Scissors</h3>
     <button class="button" onclick="
    playGame('rock');

    ">✊🏻</button>
    <button class="button" onclick="
    playGame('paper');

    ">🖐🏻</button>


    <button class="button" onclick=" playGame('scissors');">✌🏻</button> 
       
    <p class="JS-result"></p>
    <p class="JS-moves"></p>
    <p class="JS-score"></p>

    </div>

    <button onclick="
        score.win = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem('score');
        reuseable();
    " class="reset">Reset Score</button>


     <script>  

            let score = 
                JSON.parse(localStorage.getItem('score')) || {
                    win:0,
                    losses:0,
                    ties:0
                };

                reuseable()

             function pickComputerMove() {        

            const randomNumber = Math.random();
            let computerPicks = '';
                

            if (randomNumber >= 0 && randomNumber < 1 / 3) {
                computerPicks = 'rock';
            } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
                computerPicks = 'paper';
            } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
                computerPicks = 'scissors';
            }
            return computerPicks;

} 

function reuseable() {
       document.querySelector('.JS-score').innerHTML = ` wins: ${score.win}, lose: ${score.losses}, ties: ${score.ties}.`;
}

function playGame(playerMove) {
    
    const computerPicks = pickComputerMove();
    let result = '';

    if (playerMove === 'scissors') {
        if (computerPicks === 'rock') {
            result = 'you lose';
        } else if (computerPicks === 'paper') {
            result = 'you win';
        } else if (computerPicks === 'scissors') {
            result = 'tie';
        }
    } else if (playerMove === 'paper') {
        if (computerPicks === 'rock') {
            result = 'you win';
        } else if (computerPicks === 'paper') {
            result = 'tie';
        } else if (computerPicks === 'scissors') {
            result = 'you lose';
        }
    } else if (playerMove === 'rock') {
        if (computerPicks === 'rock') {
            result = 'tie';
        } else if (computerPicks === 'paper') {
            result = 'you lose';
        } else if (computerPicks === 'scissors') {
            result = 'you win';
        }
    }

    if (result === 'you win') {
        score.win += 1; 
    } else if (result === 'you lose') {
        score.losses += 1; 
    } else if (result === 'tie') {
        score.ties += 1; 
    }
    
    document.querySelector('.JS-result').innerHTML = result;
    document.querySelector('.JS-moves').innerHTML = `you played ${playerMove}, computer played ${computerPicks}`;

    reuseable();
    localStorage.setItem("score", JSON.stringify(score));
}       
 </script>
</body>
</html>
